name: advertising_id_v2
description: Fork of advertising_id with Swift Package Manager support. A Flutter plugin to access the advertising ID. Wraps ASIdentifierManager.advertisingIdentifier (on iOS) and advertising ID (on Android).
version: 2.8.0
homepage: https://github.com/operando/advertising_id
repository: https://github.com/operando/advertising_id

flutter:
  plugin:
    platforms:
      android:
        package: com.os.operando.advertisingid
        pluginClass: AdvertisingIdPlugin
      ios:
        pluginClass: AdvertisingIdPlugin


dependencies:
  flutter:
    sdk: flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"
